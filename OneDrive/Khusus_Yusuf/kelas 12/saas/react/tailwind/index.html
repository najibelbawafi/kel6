<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    <section class="w-full">
      <h1 class="text-3xl md:text-5xl  text-center my-5">Ini Grid</h1>
      <div class="grid grid-cols-3 gap-4">
        <div
          class="bg-blue-500 shadow-md text-white text-center p-5 col-span-3 md:col-span-1"
        >
          1
        </div>
        <div
          class="border-1 shadow-md border-blue-500 text-black text-center p-5 col-span-3 md:col-span-1"
        >
          2
        </div>
        <div
          class="bg-blue-500 shadow-md text-white text-center p-5 col-span-3 md:col-span-1"
        >
          3
        </div>
        <div class="border-1 shadow-md border-blue-500 text-black text-center p-5 col-span-3">4</div>
      </div>
    </section>
    <section class="w-full mt-7">
      <h1 class="text-3xl text-center my-5">Ini Flex</h1>
      <div class="grid grid-cols-2 gap-4">
        <div class="col-span-2 md:col-span-1">
          <h1 class="text-center my-5">Flex Row</h1>
          <div class="flex flex-wrap md:flex-nowrap justify-between gap-4 mx-auto w-full">
            <div
              class="shadow-md w-50 bg-blue-500 text-white text-center p-5 col-span-3 md:col-span-1"
            >
              1
            </div>
            <div
              class="shadow-md w-50 bg-blue-500 text-white text-center p-5 col-span-3 md:col-span-1"
            >
              2
            </div>
            <div
              class="shadow-md w-50 bg-blue-500 text-white text-center p-5 col-span-3 md:col-span-1"
            >
              3
            </div>
            <div class="shadow-md w-50 bg-blue-500 text-white text-center p-5 col-span-3">
              4
            </div>
            <div
              class="shadow-md w-50 bg-blue-500 text-white text-center p-5 col-span-3 md:col-span-1"
            >
              5
            </div>
            <div
              class="shadow-md w-50 bg-blue-500 text-white text-center p-5 col-span-3 md:col-span-1"
            >
              6
            </div>
            <div
              class="shadow-md w-50 bg-blue-500 text-white text-center p-5 col-span-3 md:col-span-1"
            >
              7
            </div>
            <div class="shadow-md w-50 bg-blue-500 text-white text-center p-5 col-span-3">
              8
            </div>
          </div>
        </div>
        <div class="col-span-2 md:col-span-1">
          <h1 class="text-center my-5">Flex Col</h1>
          <div class="flex flex-col gap-4 mx-auto w-full">
            <div
              class="shadow-md bg-blue-500 text-white text-center p-5 col-span-3 md:col-span-1"
            >
              1
            </div>
            <div
              class="shadow-md bg-blue-500 text-white text-center p-5 col-span-3 md:col-span-1"
            >
              2
            </div>
            <div
              class="shadow-md bg-blue-500 text-white text-center p-5 col-span-3 md:col-span-1"
            >
              3
            </div>
            <div class=" shadow-md bg-blue-500 text-white text-center p-5 col-span-3">
              4
            </div>
          </div>
        </div>
      </div>
    </section>
  </body>
</html>
